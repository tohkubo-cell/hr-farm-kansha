<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感謝が巡る — HR FARM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --farm-green:  #2d6a35;
  --farm-light:  #4a9b56;
  --farm-pale:   #a8d4ad;
  --farm-gold:   #c8941a;
  --farm-gold-lt:#e8b84a;
  --farm-cream:  #f5f0e8;
  --farm-sky:    #e8f4e9;
  --farm-dark:   #1a3d1f;
  --farm-text:   #2c4a2e;
  --bg-main:     #f2efe6;
  --bg-card:     #ffffff;
}

body {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  background: var(--bg-main);
  min-height: 100vh;
  color: var(--farm-text);
  overflow-x: hidden;
}

/* ─── BG texture ─── */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(45,106,53,0.12) 0%, transparent 60%),
    linear-gradient(180deg, #eef6ef 0%, #f2efe6 30%, #f2ede0 100%);
}

/* ─── Header ─── */
.site-header {
  position: relative; z-index: 10;
  background: var(--farm-dark);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px;
  border-bottom: 2px solid var(--farm-gold);
}
.logo-area {
  display: flex; align-items: center; gap: 10px;
}
.logo-leaf {
  width: 28px; height: 28px;
}
.logo-text {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.15rem; color: var(--farm-cream);
  letter-spacing: 0.22em;
}
.header-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
}
.header-concept {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: clamp(0.85rem, 2vw, 1.1rem);
  color: var(--farm-cream);
  letter-spacing: 0.22em;
  font-weight: 400;
}
.header-sub {
  font-size: 0.6rem; color: var(--farm-pale);
  letter-spacing: 0.16em; opacity: 0.6;
}

/* ─── Main stage ─── */
#main-stage {
  position: relative; z-index: 1;
  width: 100%; min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 0;
}

/* タイトル：左上オーバーレイ */
.stage-title {
  position: absolute;
  top: 20px; left: 28px;
  z-index: 250;
  text-align: left;
  background: rgba(245,240,232,0.75);
  backdrop-filter: blur(4px);
  padding: 8px 16px 10px;
  border-radius: 8px;
  border-left: 2px solid var(--farm-gold);
  box-shadow: 0 3px 14px rgba(26,61,31,0.10);
}
.stage-tag {
  font-size: 0.5rem; letter-spacing: 0.28em;
  color: var(--farm-light); display: block; margin-bottom: 3px;
}
.stage-h {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: clamp(0.95rem, 2vw, 1.2rem);
  color: var(--farm-dark);
  letter-spacing: 0.18em;
  line-height: 1.2;
}
.stage-concept { display: none; }

/* コンセプト帯：非表示（ヘッダーに移動） */
.concept-band { display: none; }
.concept-text { display: none; }
.concept-deco { display: none; }

/* ─── Carousel + Tree stage ─── */
#carousel-wrap {
  position: relative;
  width: 100%;
  height: min(700px, 92vw);
  margin: 0 auto;
  flex-shrink: 0;
}

/* Tree SVG center — 葉・枝（カードの背後） */
#tree-center {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -58%);
  width: min(640px, 90vw); height: min(640px, 90vw);
  z-index: 8; pointer-events: none;
  filter: drop-shadow(0 12px 28px rgba(45,106,53,0.18));
}

/* Tree trunk — 幹・根・地面（カードの前面） */
#tree-trunk {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -58%);
  width: min(640px, 90vw); height: min(640px, 90vw);
  z-index: 200; pointer-events: none;
}

/* Ground shadow under tree */
#ground-ellipse {
  display: none;
}

/* orbit-ring は非表示 */
#orbit-ring { display: none; }

/* Card slots in orbit */
.orbit-card {
  position: absolute;
  top: 0; left: 0;
  width: 320px;
  transform-origin: center center;
  z-index: 10;
  cursor: pointer;
  transition: filter 0.3s;
}
.orbit-card-inner {
  position: relative;
  transform: translate(-50%, -50%);
  background: #ffffff;
  border: 1px solid rgba(45,106,53,0.15);
  border-radius: 12px;
  padding: 14px 20px 15px;
  box-shadow: 0 3px 16px rgba(26,61,31,0.12);
  overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.orbit-card-inner::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, var(--farm-gold), transparent);
  opacity: 0.5;
}
.orbit-card.front .orbit-card-inner {
  box-shadow: 0 6px 24px rgba(26,61,31,0.22);
  border-color: rgba(200,148,26,0.35);
}
.orbit-card-inner:hover {
  box-shadow: 0 8px 28px rgba(26,61,31,0.28);
  border-color: rgba(200,148,26,0.5);
}
.orbit-cat {
  font-size: 0.80rem; letter-spacing: 0.1em; font-weight: 500;
  margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
}
.orbit-cat-dot {
  width: 9px; height: 9px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.orbit-txt {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.0rem; line-height: 1.65;
  color: #3a5c3d;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ─── Controls ─── */
.ctrl-row {
  display: flex; align-items: center; gap: 8px;
  justify-content: center; flex-wrap: wrap;
  margin: 6px 0 10px;
}
.ctrl-label { font-size: 0.62rem; color: var(--farm-light); letter-spacing: 0.1em; }
.ctrl-btn {
  background: rgba(45,106,53,0.07);
  border: 1px solid rgba(45,106,53,0.2);
  color: var(--farm-green);
  border-radius: 6px; padding: 4px 12px;
  font-size: 0.68rem; cursor: pointer;
  transition: all 0.18s;
  font-family: 'Zen Kaku Gothic New', sans-serif;
}
.ctrl-btn:hover, .ctrl-btn.on {
  background: rgba(200,148,26,0.12);
  border-color: rgba(200,148,26,0.4);
  color: var(--farm-gold);
}

/* ─── Stats bar ─── */
.stats-row {
  display: flex; gap: clamp(20px,4vw,60px);
  justify-content: center; margin-bottom: 12px;
}
.stat { text-align: center; }
.stat-n {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.8rem; color: var(--farm-gold); line-height: 1;
}
.stat-l { font-size: 0.6rem; color: var(--farm-light); letter-spacing: 0.07em; margin-top:2px; }

/* ─── Modal panel ─── */
.veil {
  display: none; position: fixed; inset: 0;
  background: rgba(26,61,31,0.55); backdrop-filter: blur(6px);
  z-index: 500; align-items: center; justify-content: center;
}
.veil.on { display: flex; }
.panel {
  width: min(860px, 94vw);
  background: #fff;
  border: 1px solid rgba(45,106,53,0.18);
  border-radius: 24px; overflow: hidden;
  box-shadow: 0 24px 72px rgba(26,61,31,0.22);
  animation: prise 0.3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes prise {
  from { opacity:0; transform:scale(0.92) translateY(16px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.pnl-bar {
  height: 5px;
  background: linear-gradient(90deg, var(--farm-dark), var(--farm-gold), var(--farm-light));
}
.pnl-top { padding: 34px 44px 24px; border-bottom: 1px solid rgba(45,106,53,0.1); position: relative; }
.pnl-cat { font-size: 1.0rem; letter-spacing: 0.14em; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.pnl-short {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.75rem; color: var(--farm-dark); line-height: 1.7;
  font-weight: 800;
}
.pnl-close {
  position: absolute; top: 24px; right: 24px;
  background: rgba(45,106,53,0.07); border: 1px solid rgba(45,106,53,0.16);
  color: var(--farm-green); width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.1rem; transition: all 0.18s;
}
.pnl-close:hover { background: rgba(200,148,26,0.12); border-color: var(--farm-gold); color: var(--farm-gold); }
.pnl-body { padding: 30px 44px 40px; }
.pnl-txt {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.35rem; line-height: 2.1; color: #2a3a2c; font-weight: 600;
}

/* ════════════════════════════
   LIST SECTION
════════════════════════════ */
#list-section {
  position: relative; z-index: 1;
  width: 100%; max-width: 900px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

.list-header {
  text-align: center; margin-bottom: 20px;
}
.list-divider {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 22px;
}
.list-divider-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(45,106,53,0.25), transparent);
}
.list-divider-label {
  font-size: 0.6rem; letter-spacing: 0.3em;
  color: var(--farm-light); white-space: nowrap;
}

/* Filter tabs */
.filter-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  justify-content: center; margin-bottom: 18px;
}
.filter-btn {
  background: rgba(45,106,53,0.06);
  border: 1px solid rgba(45,106,53,0.18);
  color: var(--farm-green);
  border-radius: 20px; padding: 5px 14px;
  font-size: 0.68rem; cursor: pointer;
  transition: all 0.18s;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  display: flex; align-items: center; gap: 5px;
}
.filter-btn.on {
  background: var(--farm-dark);
  border-color: var(--farm-dark);
  color: var(--farm-cream);
}
.filter-dot {
  width: 7px; height: 7px; border-radius: 50%;
}

/* Card grid */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}
.list-card {
  background: #fff;
  border: 1px solid rgba(45,106,53,0.12);
  border-radius: 10px; padding: 14px 16px;
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.list-card::before {
  content:'';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  border-radius: 2px 0 0 2px;
  background: var(--cat-color, var(--farm-pale));
  opacity: 0.7;
}
.list-card:hover {
  box-shadow: 0 4px 18px rgba(26,61,31,0.14);
  border-color: rgba(200,148,26,0.3);
  transform: translateY(-2px);
}
.list-card-cat {
  font-size: 0.56rem; letter-spacing: 0.1em;
  font-weight: 500; margin-bottom: 5px;
  display: flex; align-items: center; gap: 4px;
}
.list-card-short {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 0.78rem; line-height: 1.65;
  color: #3a5040;
}

/* Field bottom decoration */
.field-deco {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 14vh; z-index: 0; pointer-events: none; overflow: hidden;
}
.field-svg {
  position: absolute; bottom: 0; left: 0; width: 220%; height: 100%;
  animation: fieldDrift 22s linear infinite; opacity: 0.55;
}
@keyframes fieldDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(-45.4%); }
}

/* Wind lines */
.wl {
  position: fixed; height: 1px; pointer-events: none; z-index: 0;
  background: linear-gradient(90deg, transparent, rgba(45,106,53,0.08), transparent);
  animation: wlMove linear infinite; opacity: 0;
}
@keyframes wlMove {
  0%   { transform: translateX(-110%); opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 0.4; }
  100% { transform: translateX(110vw); opacity: 0; }
}

/* Responsive */
@media (max-width: 520px) {
  .orbit-card { width: 130px; }
  .orbit-card-inner { padding: 7px 10px 8px; }
  .orbit-txt { font-size: 0.65rem; }
}
</style>
</head>

  {cat:"成長・挑戦",        short:"時間を使って現状を細かく分析・FBしてくれた", text:"営業スキルだけでなく、仕事全体に対する課題や伸び悩みについて相談した際、沢山の時間を使ってMTGしてくださり、私の現状について細かく分析してFBしてくださった事。お忙しいはずなのに、本当にありがとうございますの気持ちです！！！！"},
  {cat:"プロジェクト",      short:"クリ部が関係構築してくれたから受注できた", text:"サイト納品が終わった直後にパンフレットを受注した企業があるのですが、これはサイト納品においてクリ部の方が積極的に先方と会話をしてくださり、関係構築をしてくださったからが故の受注です！この案件に限らず、いつもクリ部の方々には沢山助けていただいていて、本当に大感謝です！ありがとうございます！！"},

  {cat:"縁の下の力持ち",    short:"営業が案件を持ってくるからサポートの仕事が始まる", text:"営業さんへ 営業さんが案件を持ってきてくださるから、私たちサポートの仕事がはじまります。お客様との最初の信頼関係を丁寧に築いてくれているおかげで、安心してサポートに入れています。いつもありがとうございます。"},
  {cat:"縁の下の力持ち",    short:"上野さん・竹重さん、勤怠や請求の複雑な処理をありがとう", text:"上野さん、竹重さんたちが勤怠や請求まわりの複雑な処理をこなしてくれるおかげで、いつも助かっています。ありがとうございます。"},
  {cat:"縁の下の力持ち",    short:"TRAYコンテンツチーム、丁寧なコンテンツが支えてくれている", text:"TRAYなど、自社サービスのコンテンツチームへ TRAYやビートバンなど、お客様が自社サービスを正しく使いこなせるのは、丁寧に作られたコンテンツがあるからだと思います。いつも支えてくださりありがとうございます。"},
  {cat:"助け合い・フォロー", short:"かんちゃん、忙しいのにジール様の業務を対応してくれてありがとう", text:"かんちゃん！忙しいのにいつもジール様の業務を対応してくれてありがとう！"},
  {cat:"助け合い・フォロー", short:"サブ担当の方、いつも業務分担ありがとうございます", text:"サブ担当の方へ、いつも業務分担していただきありがとうございます。"},
  {cat:"プロジェクト",      short:"期末に一体となって目標達成に向けて力を合わせた", text:"期末、数字が足りないときに、営業、制作、マーケ、販管一体となって、なんとか達成に向けて力を合わせているとき、みんなありがとう！という気持ちになります。"},
  {cat:"気遣い・温かさ",    short:"心が沈んでいるのを察して飲みに誘ってくれた先輩", text:"なんとなく心が沈んでいるとき、それを察して飲みに誘ってくれて、話を聞いてくれた先輩たち。本当にありがとうございます！"},
  {cat:"助け合い・フォロー", short:"二課のみんな、納品で切羽詰まった時に手伝ってくれた", text:"二課のみんな。モチベーションが上がらなくて、うだうだしているときも、解決策を考えてくれました。納品で切羽詰まった私に、「何かできることある？」と声をかけてくれて、業務を手伝ってくれました。ありがとう！"},
  {cat:"成長・挑戦",        short:"副社長・圡井さんの真剣な向き合いに感謝", text:"圡井さん。副社長とは思えないくらいフランク。社員のことをよく見ていて、1年生ともたくさん遊んでくれました。会社を良くしようと奮闘してくれていて、新入社員の私にも、大切なことを真剣に話してくれて、嬉しかったです。ありがとう！"},
  {cat:"成長・挑戦",        short:"福村さん、挑戦できたのは環境を作ってくれたおかげ", text:"福村さん。自分が入っていない案件も、上手く回っているのかしっかり確認してくれて、見守ってくれていました。この1年間、自分がやりたいように、たくさん挑戦できたのは、福村さんが環境を作ってくれたおかげです。ありがとう！"},
  {cat:"成長・挑戦",        short:"1年目から頼りになりすぎます。いつもありがとう！", text:"１年目（現在の２年目）が初年度から頼りになりすぎます。いつもありがとう！"},
  {cat:"成長・挑戦",        short:"康生さんのご指導でクリ部の将来が明るくなっている", text:"康生さんに日々ご指導いただけることで、クリエイティブの中核となるスキルを伸ばすことができ、クリ部の将来が明るくなっていることを感じます。いつもありがとうございます！"},
  {cat:"成長・挑戦",        short:"泰一さんの改革で生産効率が上がりいい仕事ができる", text:"泰一さんが事業レベル、商材レベルの改革を主導してくださったことで、生産効率が上がりいい仕事がたくさんできるようになると感じています。ありがとうございます！"},
  {cat:"助け合い・フォロー", short:"人生初テレアポを2課全員で支えてくれた", text:"人生初のテレアポに挑戦する時、不安もありましたが、営業2課の皆さんがいつも声をかけてくださり心強かったです。2課の皆さんが温かく迎えてくれたおかげで早く社内に馴染むことができ、とっても感謝しています！"},
  {cat:"気遣い・温かさ",    short:"金子さんの熱心な声かけでカケハシへの入社を決めた", text:"転職時、他社と迷っていた中で、金子さんが熱心に声をかけてくださり、その想いに惹かれてカケハシへの入社を決めました。今は仕事も楽しく、カケハシを選んでよかったと感じています。背中を押してくれた金子さんに感謝しています！"},
  {cat:"気遣い・温かさ",    short:"上野さん、月1回の面談の時間をありがとうございます", text:"上野さん、お忙しいのに月に1回面談の時間を設けていただきありがとうございます。"},
  {cat:"助け合い・フォロー", short:"CA部のみなさん、困っているときに助けてくれてありがとう", text:"CA部のみなさん、困っているときや忙しいときに助けてくれてありがとうございます。"},
  {cat:"チームワーク",      short:"松山さん、新人受け入れ体制づくりを率先してくれた", text:"松山さん、いつも笑わせてくれてありがとうございます！と同時に、課の新人受け入れに関して、研修内容の設計や受け入れ体制づくりを誰よりも率先して組んでいただき、ありがとうございます！とても心強いです！"},
  {cat:"気遣い・温かさ",    short:"太田さん、裁量を持って任せてくれて安心感につながっている", text:"太田さん、いつも快く相談に乗っていただきありがとうございます。受注に向けた後押しや働きやすさについて都度相談にのっていただけること、また裁量を持って任せていただけることが、今の自分の安心感や働きやすさに繋がっています。感謝です！"},
  {cat:"成長・挑戦",        short:"岩崎さん・大對さん・原田さん、アポ同行でたくさん学べた", text:"岩崎さん・大對さん・原田さん いつもアポに同行いただきありがとうございます。TRAYコンテンツの紹介事例やヒアリングからの紹介の流れ、事例の使い方、新卒採用市場の課題をどう解決するかといった本当様々なノウハウを、日々のミーティングやアポの中でたくさん学ばせていただいています。大変感謝しております！"},
  {cat:"気遣い・温かさ",    short:"玲ちゃん、ストレートに感情を伝えてくれる可愛さに感謝", text:"会いたい！とか、嬉しい！とか、いつもストレートに感情を伝えてくれる玲ちゃん（小田柿玲子さん）の可愛さに感謝してます！私もまっすぐにラブを発信したい。"},
  {cat:"気遣い・温かさ",    short:"中川さん、いつもまるっと一任して信じてくれてありがとう", text:"中川さんへ。当たり前だと思い過ぎてしまっていますが、どんな仕事でも、いつも何も指定せず、やること、その決め方、進め方、まるっと一任してくださり、そして信じてくださり、感謝しています。"},
  {cat:"縁の下の力持ち",    short:"宅急便や郵便の受付対応してくれる若手のみなさんありがとう", text:"いつも私宛の宅急便や郵便、その他受付対応してくれる若手のみなさんありがとう。"},
  {cat:"縁の下の力持ち",    short:"備品の補充や在庫報告してくれる若手のみなさんありがとう", text:"同じく備品の補充や在庫報告してくれる若手のみなさんありがとう。"},
  {cat:"縁の下の力持ち",    short:"神棚・給水機を毎日補充してくれる方へ", text:"給水機の水や神棚の水、トイレのペーパータオル等見えないところで色々と交換・補充してくださっている方々に感謝です。"},
  {cat:"気遣い・温かさ",    short:"先輩・上司が毎日「今日は大丈夫？」と声をかけてくれる", text:"佐々木さんや大久保さん、吉田さん相澤さんなど課の先輩・上司が毎日今日は大丈夫？と聞いて、すぐに助けてくださいます。感謝しかありません。"},
  {cat:"助け合い・フォロー", short:"小西さん、一緒にテレアポやろうと言えば力が湧く", text:"小西にテレアポ一緒にしようよ、というと毎回必ず「もちろん♪たくさん掛けちゃうわよ♪」と答えてくれます。一人では乗り気にならない日も、一緒にやれば力が湧きます。ありがとう！"},
  {cat:"チームワーク",      short:"社内外みんなの力を借りて仕事できていることに感謝", text:"制作の案件は一人で仕事が完結することはないので、社内のメンバーはもちろん、外部のブレーンさんやお客様含めて皆さんに感謝しています。日々、色々な人の力を借りて仕事をさせていただいているなと感じます。"},
  {cat:"成長・挑戦",        short:"泰一さん、いつも的確なFBをありがとうございます", text:"泰一さんにいつも的確なFBをいただけてありがたいです。"},
  {cat:"気遣い・温かさ",    short:"管野さんのこまやかなサポートにいつも助けられている", text:"管野さんのこまやかなサポートにいつも助けられています。"},
  {cat:"縁の下の力持ち",    short:"おのちゃんのこまやかな仕事ぶりに安心して任せられる", text:"おのちゃんのこまやかな仕事ぶりに、いつも安心して仕事を任せることができます。"},
  {cat:"縁の下の力持ち",    short:"神棚のお水や有線のスイッチを毎日入れてくれてありがとう", text:"いつも神棚のお水や有線のスイッチをいれてくれてありがとうございます！見えないところもでも毎日対応してくれている人がいるのはとてもありがたいし、気づいて続けてくれる心が素敵です！！"},
  {cat:"成長・挑戦",        short:"川端さんの向上心にいつも刺激をもらっている", text:"川端さんの向上心にいつも刺激をもらっています。"},
  {cat:"成長・挑戦",        short:"津野くん、一人でトラブルを解決し切った時には驚いた", text:"津野くんが一人でトラブルを解決し切った時には驚きました。いつもありがとう。"},
  {cat:"気遣い・温かさ",    short:"東條さんのエネルギッシュな姿に毎日元気をもらっている", text:"東條さんのいつも明るくエネルギッシュな姿に元気をもらっています。いつもありがとう。"},
  {cat:"チームワーク",      short:"お客様への伝え方まで見てくれて負荷の大きい案件も進められた", text:"関係者の皆さまへ、案件で細かくサイトデザインや仕様を確認していただくだけでなく、お客様への伝え方まで見ていただけてとても助かっています。負荷の大きい案件も進められたのは、皆さまのおかげです。"},
  {cat:"チームワーク",      short:"松浦祥子さんの丁寧なレス振りに特大感謝", text:"営業のみんなのスケジュールの配慮や色々な確認をしながら丁寧に素早く毎日レスを振ってくれる松浦祥子さんに特大感謝です！そしてそれを素早く繋いでくれるインサイドの谷口さん渡部くんにも特大感謝です！いつもありがとうございます！"},
  {cat:"成長・挑戦",        short:"中野さんは超人の域。いつもありがとうございます", text:"新卒・中途・研修・制作・TRAY・TRACE・Beatbanとすべてのマーケティング施策と予算配分とアポ取得体制にあたまを巡らせ、アトラクションも対応し、様々なプロジェクトでMTGもすし詰めで、それでいて色々なAIを活用した診断等のサービスを生み出し、良いと思ったニュース記事や他社施策を積極的に共有してくださる中野さんは超人の域ではと。いつもありがとうございます！"},
  {cat:"縁の下の力持ち",    short:"営業が売り続けられるのはみんなのおかげ", text:"営業の皆さんが顧客対応をして、連絡をとり、お客様のことを考え、忙しい顧客訪問の合間をぬって企画をつくり、商談を進めて受注してくれ、かつ営業＆納品部隊のみんなで良い納品をしてくれるからこそ今のカケハシが成り立っています。いつもありがとうございます…！"},
  {cat:"気遣い・温かさ",    short:"カケハシの皆さんのあたたかさ、いつも感謝でいっぱい", text:"質問や相談をしたとき、どんなに小さなことでもすぐに＆丁寧に反応してくださるのがカケハシの皆さんのあたたかさであり、いつも感謝の気持ちでいっぱいになります！"},
  {cat:"助け合い・フォロー", short:"細かい部分に気づいてくれるため日々助かっている", text:"仕事を進めていく中で、細かい部分に気づいてくれるため、日々助かっています。"},
  {cat:"縁の下の力持ち",    short:"松浦祥子さん、マーケを支えてくれていつもありがとう", text:"松浦祥子さん、どんな業務を快く引き受けてくれて、どんなに忙しくても報告・共有も丁寧で、気遣いの一言も添えられていて、本当に尊敬しかありません！マーケは松浦さんに支えられています！いつもありがとうございます！"},
  {cat:"成長・挑戦",        short:"中野さん、クロードコードを教えてくれてありがとう！", text:"中野さん、AIについてたくさんレクチャーしていただきありがとうございます。クロードコードを教えていただいたおかげで、仕事の効率が格段に上がりました。AIマスター、尊敬です！！！！"},
  {cat:"成長・挑戦",        short:"立花さん、AIで自動化を進めてくれてチーム全体が効率アップ", text:"立花さん、採用マーケやインサイドへの指示出しなど、さまざまな業務を推進してくださりありがとうございます！AIやワークフローを駆使して自動化を進めてくださっているおかげで、チーム全体の業務効率が格段に上がっています。子育てもしながらここまで取り組まれていて本当にすごいです。いつもありがとうございます！"},
  {cat:"助け合い・フォロー", short:"相原ちゃん・佐口さん、自分の案件でないのに力を貸してくれた", text:"相原ちゃん、佐口さん、自分の案件出ないにもかかわらず私の案件に力を貸してくださり本当にありがとうございますしぬほど助けられました。"},
  {cat:"助け合い・フォロー", short:"育休を温かく送り出してくれてありがとうございます", text:"これから育休をとる僕を応援してくれて温かく送り出してくれてありがとうございます。"},
  {cat:"気遣い・温かさ",    short:"何事もいやな顔せず相談できる先輩に日々感謝", text:"何事もいやな顔せず、相談できる先輩に日々感謝です！"},
  {cat:"気遣い・温かさ",    short:"出産や育児についても相談できる環境に感謝", text:"初めて体験するプライベートのこと（出産や育児）についても、共有して相談できる周りの環境に感謝しています！"},
  {cat:"助け合い・フォロー", short:"急遽休んだ時にみなさんが業務を助けてくれた", text:"私が急遽お休みをいただいた時に、青沼さん、東井上さん、礒部さんを始め、みなさんが業務を助けてくれました。ありがとうございます！"},
  {cat:"助け合い・フォロー", short:"困った時にすぐ改善案を一緒に考えてくれる青沼さん", text:"困った時に、すぐに改善案を一緒に考えてくださる青沼さん、ありがとうございます！"},
  {cat:"縁の下の力持ち",    short:"案件を持ってきてくださる営業の皆さんありがとう", text:"案件を持ってきてくださる営業の皆さん、ありがとうございます！"},
  {cat:"チームワーク",      short:"クリエイティブ、これからも一緒にいい物を作ろう", text:"クリエイティブのみなさんへ。難易度の高い案件も増えてきましたが、お客様への連絡も含め進めていただきありがとうございます！これからも一緒にいいモノ作っていきましょう！！"},
  {cat:"チームワーク",      short:"マーケのみなさん、レス振りのおかげで新規の数字が稼げている", text:"マーケのみなさんへ。いつもレス振りありがとうございます！皆さんのおかげで新規の数字が稼げているので本当に感謝です！引き続きたくさん決めれるよう頑張りますのでよろしくお願いします！"},
  {cat:"縁の下の力持ち",    short:"経営管理部、おかげで不自由なく仕事ができている", text:"経営管理部のみなさんへ。なかなか直接感謝をお伝えできるタイミングが少ないのですが、みなさんのおかげで私たちが不自由なく仕事ができていると思っています。いつも本当にありがとうございます！"},
  {cat:"気遣い・温かさ",    short:"管野さん、感謝をまっすぐ伝えてくれる優しい先輩", text:"管野さんがいつも感謝を真っすぐ伝えてくださり、こちらこそ『いつもありがとうございます！』という気持ちになります。入社してからずっと気にかけてくださっていて、本当に優しい先輩です。"},
  {cat:"気遣い・温かさ",    short:"上野さん、カケハシ社員をずっと支えてくれてありがとう", text:"上野さんへ。いつも温かくご相談に乗ってくださりありがとうございます！不安なことがある時、困っている時、何度も助けていただきました。きっと上野さんに安心をもらっている社員はたくさんいると思います。いつもカケハシ社員を支えてくださって本当にありがとうございます！"},
  {cat:"気遣い・温かさ",    short:"研修現場の話を共有してくれる時、素敵だなと思う", text:"メンバーがいろんな研修現場のあとで、受講者の様子や良い場になった話をしてくれている時、素敵だなーとか一緒にやってくれてありがとう！という気持ちになっています！"},
  {cat:"助け合い・フォロー", short:"慣れないハドルミーティングいつもありがとうございます", text:"慣れないハドルミーティングいつもありがとうございます！！！"},
  {cat:"助け合い・フォロー", short:"役割関らず気付いたときに対応、どこまで気が利くんだ", text:"テンプレ変更しようと思ったときに「変更済みです」って連絡もらったとき。タイミングも相まって役割関らず気付いたときに対応していただいて、どこまで気が利くんだ感謝と思いました！！！"},
  {cat:"プロジェクト",      short:"オルビスチーム、誰一人欠けても無理だった", text:"オルビス様プロジェクトチームのみんなへ。数多くの困難に立ち向かい、粘り強く挑み続けてくれて本当にありがとう。誰一人かけても、ゴールまでたどり着くことはできなかったと思います。本当にありがとう。"},
  {cat:"プロジェクト",      short:"TRAYプロジェクト、主体的に取り組んでくれてありがとう", text:"TRAY・TRACEプロジェクトチームのみんなへ。それぞれメインミッションを別で持ちながら、サービスの向上と浸透に向けて日々、主体的に取り組んでくれてありがとう。16期、より一層の飛躍に向けて引き続き、一緒に挑んでいこう。いつもありがとうございます。"},
  {cat:"気遣い・温かさ",    short:"佐々木君の元気な声にいつもこちらが元気をもらっている", text:"キャリア事業部の佐々木君の元気な声には、いつもこちらが元気をもらっています！"},
  {cat:"縁の下の力持ち",    short:"神棚の榊やお水を毎日対応してくれてありがとう", text:"いつも神棚の榊やお水を毎日対応してくれてる皆さん、ありがとうございます！"},

// ══════════════════════════════════════
//  CAROUSEL ENGINE — 縦スタック グループ軌道
//  3枚1組で楕円を周回。
//  前面に来たとき3枚が縦に広がって全部見える。
//  背面では重なって1枚分に収束。
// ══════════════════════════════════════
const STACK = 3;
let angle = 0;
let speed = 0.08;
let paused = false;
let raf;

const wrap    = document.getElementById('carousel-wrap');
const orbitEl = document.getElementById('orbit-cards');
const W = () => wrap.offsetWidth;
const H = () => wrap.offsetHeight;

const GROUPS    = Math.ceil(data.length / STACK);
const GROUP_GAP = (Math.PI * 2) / GROUPS;

// カードの見た目の高さ＋隙間（px）
const CARD_H  = 108;
const CARD_GAP = 10;

const cardEls = data.map((item, i) => {
  const ci = cats[item.cat];
  const el = document.createElement('div');
  el.className = 'orbit-card';
  el.innerHTML = `
    <div class="orbit-card-inner">
      <div class="orbit-cat">
        <span class="orbit-cat-dot" style="background:${ci.color}"></span>
        <span style="color:${ci.color}">${item.cat}</span>
      </div>
      <div class="orbit-txt">${item.short}</div>
    </div>
  `;
  el.querySelector('.orbit-card-inner').addEventListener('click', () => openPanel(item));
  orbitEl.appendChild(el);
  return el;
});

function orbitFrame() {
  if (!paused) angle += speed * Math.PI / 180;

  const w = W(), h = H();
  const cx = w / 2, cy = h * 0.35;
  const rx = w * 0.42, ry = h * 0.25;

  data.forEach((item, i) => {
    const gIdx     = Math.floor(i / STACK);
    const posInGrp = i % STACK;
    const stackSz  = Math.min(STACK, data.length - gIdx * STACK);

    // グループの軌道角度
    const a    = angle + gIdx * GROUP_GAP;
    const cosA = Math.cos(a), sinA = Math.sin(a);
    // depth: 0=真後ろ、1=真前
    const depth = (sinA + 1) / 2;

    // グループ中心の座標
    const gx = cx + cosA * rx;
    const gy = cy + sinA * ry * 0.65;

    // 縦スタックのY オフセット
    // depth=1 → 完全展開（各カードが等間隔縦並び）
    // depth=0 → 完全収束（全カードが中心に重なる）
    const spread    = Math.max(0, (depth - 0.3) / 0.7); // 0.3以下では重なる
    const totalH    = (stackSz - 1) * (CARD_H + CARD_GAP);
    const expandedY = -totalH / 2 + posInGrp * (CARD_H + CARD_GAP);
    // 背面では後ろのカードを少しずらしてスタック感
    const collapsedY = posInGrp * 4;
    const cardOffsetY = expandedY * spread + collapsedY * (1 - spread);

    const sx = gx;
    const sy = gy + cardOffsetY;

    const scale = 0.36 + depth * 0.64;

    // 前面: 全カード見える。背面: 先頭だけ薄く見える
    let opacity;
    if (depth < 0.06) {
      opacity = 0;
    } else if (depth > 0.45) {
      opacity = 0.12 + depth * 0.88; // 前面は全枚表示
    } else {
      // 背面: posInGrp=0 だけうっすら、後続は非表示
      opacity = posInGrp === 0 ? (0.08 + depth * 0.4) : 0;
    }

    const z        = Math.round(depth * 100) * 10 + (STACK - posInGrp);
    const isFront  = depth > 0.65;

    const el = cardEls[i];
    el.style.cssText = `
      position:absolute; left:${sx}px; top:${sy}px;
      transform:scale(${scale.toFixed(3)});
      opacity:${Math.max(0, opacity).toFixed(3)};
      z-index:${z};
      pointer-events:${isFront ? 'all' : 'none'};
      will-change:transform,opacity;
    `;
    el.classList.toggle('front', isFront);
  });

  raf = requestAnimationFrame(orbitFrame);
}

orbitFrame();

function setSpeed(v) {
  speed = v;
  ['spd0','spd1','spd2'].forEach((id, idx) => {
    document.getElementById(id).classList.toggle('on', [0.08, 0.5, 1.2][idx] === v);
  });
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = paused ? '▶ 流す' : '⏸ 止める';
  btn.classList.toggle('on', paused);
  if (!paused) orbitFrame();
}

// ══════════════════════════════════════
//  PANEL
// ══════════════════════════════════════
function openPanel(item) {
  const ci = cats[item.cat];
  document.getElementById('pnlCat').innerHTML =
    `<span class="orbit-cat-dot" style="background:${ci.color};width:8px;height:8px;border-radius:50%;display:inline-block;"></span>
     <span style="color:${ci.color}">${item.cat}</span>`;
  document.getElementById('pnlShort').textContent = item.short;
  document.getElementById('pnlTxt').textContent   = item.text;
  document.getElementById('veil').classList.add('on');
}
function closePanel() { document.getElementById('veil').classList.remove('on'); }
function handleVeil(e) { if (e.target === document.getElementById('veil')) closePanel(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// ══════════════════════════════════════
//  LIST + FILTER
// ══════════════════════════════════════
let activeCat = 'ALL';

// Build filter buttons
const filterRow = document.getElementById('filterRow');
Object.entries(cats).forEach(([name, ci]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.setAttribute('data-cat', name);
  btn.onclick = () => filterCat(name);
  btn.innerHTML = `<span class="filter-dot" style="background:${ci.color}"></span>${name}`;
  filterRow.appendChild(btn);
});

function filterCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-cat') === cat);
  });
  renderList();
}

function renderList() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  const filtered = activeCat === 'ALL' ? data : data.filter(d => d.cat === activeCat);
  filtered.forEach(item => {
    const ci = cats[item.cat];
    const card = document.createElement('div');
    card.className = 'list-card';
    card.style.setProperty('--cat-color', ci.color);
    card.innerHTML = `
      <div class="list-card-cat" style="color:${ci.color}">
        <span class="orbit-cat-dot" style="background:${ci.color};width:6px;height:6px;border-radius:50%;display:inline-block;"></span>
        ${item.cat}
      </div>
      <div class="list-card-short">${item.short}</div>
    `;
    card.addEventListener('click', () => openPanel(item));
    grid.appendChild(card);
  });
}

renderList();
