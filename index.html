<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感謝が巡る — HR FARM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --farm-green:  #2d6a35;
  --farm-light:  #4a9b56;
  --farm-pale:   #a8d4ad;
  --farm-gold:   #c8941a;
  --farm-gold-lt:#e8b84a;
  --farm-cream:  #f5f0e8;
  --farm-sky:    #e8f4e9;
  --farm-dark:   #1a3d1f;
  --farm-text:   #2c4a2e;
  --bg-main:     #f2efe6;
  --bg-card:     #ffffff;
}

body {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  background: var(--bg-main);
  min-height: 100vh;
  color: var(--farm-text);
  overflow-x: hidden;
}

/* ─── BG texture ─── */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(45,106,53,0.12) 0%, transparent 60%),
    linear-gradient(180deg, #eef6ef 0%, #f2efe6 30%, #f2ede0 100%);
}

/* ─── Header ─── */
.site-header {
  position: relative; z-index: 10;
  background: var(--farm-dark);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px;
  border-bottom: 2px solid var(--farm-gold);
}
.logo-area {
  display: flex; align-items: center; gap: 10px;
}
.logo-leaf {
  width: 28px; height: 28px;
}
.logo-text {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.15rem; color: var(--farm-cream);
  letter-spacing: 0.22em;
}
.header-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
}
.header-concept {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: clamp(0.85rem, 2vw, 1.1rem);
  color: var(--farm-cream);
  letter-spacing: 0.22em;
  font-weight: 400;
}
.header-sub {
  font-size: 0.6rem; color: var(--farm-pale);
  letter-spacing: 0.16em; opacity: 0.6;
}

/* ─── Main stage ─── */
#main-stage {
  position: relative; z-index: 1;
  width: 100%; min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 0;
}

/* タイトル：左上オーバーレイ */
.stage-title {
  position: absolute;
  top: 20px; left: 28px;
  z-index: 250;
  text-align: left;
  background: rgba(245,240,232,0.75);
  backdrop-filter: blur(4px);
  padding: 8px 16px 10px;
  border-radius: 8px;
  border-left: 2px solid var(--farm-gold);
  box-shadow: 0 3px 14px rgba(26,61,31,0.10);
}
.stage-tag {
  font-size: 0.5rem; letter-spacing: 0.28em;
  color: var(--farm-light); display: block; margin-bottom: 3px;
}
.stage-h {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: clamp(0.95rem, 2vw, 1.2rem);
  color: var(--farm-dark);
  letter-spacing: 0.18em;
  line-height: 1.2;
}
.stage-concept { display: none; }

/* コンセプト帯：非表示（ヘッダーに移動） */
.concept-band { display: none; }
.concept-text { display: none; }
.concept-deco { display: none; }

/* ─── Carousel + Tree stage ─── */
#carousel-wrap {
  position: relative;
  width: 100%;
  height: min(700px, 92vw);
  margin: 0 auto;
  flex-shrink: 0;
}

/* Tree SVG center — 葉・枝（カードの背後） */
#tree-center {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -58%);
  width: min(640px, 90vw); height: min(640px, 90vw);
  z-index: 8; pointer-events: none;
  filter: drop-shadow(0 12px 28px rgba(45,106,53,0.18));
}

/* Tree trunk — 幹・根・地面（カードの前面） */
#tree-trunk {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -58%);
  width: min(640px, 90vw); height: min(640px, 90vw);
  z-index: 200; pointer-events: none;
}

/* Ground shadow under tree */
#ground-ellipse {
  display: none;
}

/* orbit-ring は非表示 */
#orbit-ring { display: none; }

/* Card slots in orbit */
.orbit-card {
  position: absolute;
  top: 0; left: 0;
  width: 320px;
  transform-origin: center center;
  z-index: 10;
  cursor: pointer;
  transition: filter 0.3s;
}
.orbit-card-inner {
  position: relative;
  transform: translate(-50%, -50%);
  background: #ffffff;
  border: 1px solid rgba(45,106,53,0.15);
  border-radius: 12px;
  padding: 14px 20px 15px;
  box-shadow: 0 3px 16px rgba(26,61,31,0.12);
  overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.orbit-card-inner::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, var(--farm-gold), transparent);
  opacity: 0.5;
}
.orbit-card.front .orbit-card-inner {
  box-shadow: 0 6px 24px rgba(26,61,31,0.22);
  border-color: rgba(200,148,26,0.35);
}
.orbit-card-inner:hover {
  box-shadow: 0 8px 28px rgba(26,61,31,0.28);
  border-color: rgba(200,148,26,0.5);
}
.orbit-cat {
  font-size: 0.80rem; letter-spacing: 0.1em; font-weight: 500;
  margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
}
.orbit-cat-dot {
  width: 9px; height: 9px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.orbit-txt {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.0rem; line-height: 1.65;
  color: #3a5c3d;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ─── Controls ─── */
.ctrl-row {
  display: flex; align-items: center; gap: 8px;
  justify-content: center; flex-wrap: wrap;
  margin: 6px 0 10px;
}
.ctrl-label { font-size: 0.62rem; color: var(--farm-light); letter-spacing: 0.1em; }
.ctrl-btn {
  background: rgba(45,106,53,0.07);
  border: 1px solid rgba(45,106,53,0.2);
  color: var(--farm-green);
  border-radius: 6px; padding: 4px 12px;
  font-size: 0.68rem; cursor: pointer;
  transition: all 0.18s;
  font-family: 'Zen Kaku Gothic New', sans-serif;
}
.ctrl-btn:hover, .ctrl-btn.on {
  background: rgba(200,148,26,0.12);
  border-color: rgba(200,148,26,0.4);
  color: var(--farm-gold);
}

/* ─── Stats bar ─── */
.stats-row {
  display: flex; gap: clamp(20px,4vw,60px);
  justify-content: center; margin-bottom: 12px;
}
.stat { text-align: center; }
.stat-n {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1.8rem; color: var(--farm-gold); line-height: 1;
}
.stat-l { font-size: 0.6rem; color: var(--farm-light); letter-spacing: 0.07em; margin-top:2px; }

/* ─── Modal panel ─── */
.veil {
  display: none; position: fixed; inset: 0;
  background: rgba(26,61,31,0.55); backdrop-filter: blur(6px);
  z-index: 500; align-items: center; justify-content: center;
}
.veil.on { display: flex; }
.panel {
  width: min(480px, 92vw);
  background: #fff;
  border: 1px solid rgba(45,106,53,0.18);
  border-radius: 18px; overflow: hidden;
  box-shadow: 0 24px 72px rgba(26,61,31,0.22);
  animation: prise 0.3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes prise {
  from { opacity:0; transform:scale(0.92) translateY(16px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.pnl-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--farm-dark), var(--farm-gold), var(--farm-light));
}
.pnl-top { padding: 20px 24px 14px; border-bottom: 1px solid rgba(45,106,53,0.1); position: relative; }
.pnl-cat { font-size: 0.65rem; letter-spacing: 0.14em; font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.pnl-short {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 1rem; color: var(--farm-dark); line-height: 1.6;
}
.pnl-close {
  position: absolute; top: 16px; right: 16px;
  background: rgba(45,106,53,0.07); border: 1px solid rgba(45,106,53,0.16);
  color: var(--farm-green); width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 0.8rem; transition: all 0.18s;
}
.pnl-close:hover { background: rgba(200,148,26,0.12); border-color: var(--farm-gold); color: var(--farm-gold); }
.pnl-body { padding: 16px 24px 22px; }
.pnl-txt {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 0.88rem; line-height: 2; color: #3a4a3c; font-weight: 300;
}

/* ════════════════════════════
   LIST SECTION
════════════════════════════ */
#list-section {
  position: relative; z-index: 1;
  width: 100%; max-width: 900px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

.list-header {
  text-align: center; margin-bottom: 20px;
}
.list-divider {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 22px;
}
.list-divider-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(45,106,53,0.25), transparent);
}
.list-divider-label {
  font-size: 0.6rem; letter-spacing: 0.3em;
  color: var(--farm-light); white-space: nowrap;
}

/* Filter tabs */
.filter-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  justify-content: center; margin-bottom: 18px;
}
.filter-btn {
  background: rgba(45,106,53,0.06);
  border: 1px solid rgba(45,106,53,0.18);
  color: var(--farm-green);
  border-radius: 20px; padding: 5px 14px;
  font-size: 0.68rem; cursor: pointer;
  transition: all 0.18s;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  display: flex; align-items: center; gap: 5px;
}
.filter-btn.on {
  background: var(--farm-dark);
  border-color: var(--farm-dark);
  color: var(--farm-cream);
}
.filter-dot {
  width: 7px; height: 7px; border-radius: 50%;
}

/* Card grid */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}
.list-card {
  background: #fff;
  border: 1px solid rgba(45,106,53,0.12);
  border-radius: 10px; padding: 14px 16px;
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.list-card::before {
  content:'';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  border-radius: 2px 0 0 2px;
  background: var(--cat-color, var(--farm-pale));
  opacity: 0.7;
}
.list-card:hover {
  box-shadow: 0 4px 18px rgba(26,61,31,0.14);
  border-color: rgba(200,148,26,0.3);
  transform: translateY(-2px);
}
.list-card-cat {
  font-size: 0.56rem; letter-spacing: 0.1em;
  font-weight: 500; margin-bottom: 5px;
  display: flex; align-items: center; gap: 4px;
}
.list-card-short {
  font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  font-size: 0.78rem; line-height: 1.65;
  color: #3a5040;
}

/* Field bottom decoration */
.field-deco {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 14vh; z-index: 0; pointer-events: none; overflow: hidden;
}
.field-svg {
  position: absolute; bottom: 0; left: 0; width: 220%; height: 100%;
  animation: fieldDrift 22s linear infinite; opacity: 0.55;
}
@keyframes fieldDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(-45.4%); }
}

/* Wind lines */
.wl {
  position: fixed; height: 1px; pointer-events: none; z-index: 0;
  background: linear-gradient(90deg, transparent, rgba(45,106,53,0.08), transparent);
  animation: wlMove linear infinite; opacity: 0;
}
@keyframes wlMove {
  0%   { transform: translateX(-110%); opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 0.4; }
  100% { transform: translateX(110vw); opacity: 0; }
}

/* Responsive */
@media (max-width: 520px) {
  .orbit-card { width: 130px; }
  .orbit-card-inner { padding: 7px 10px 8px; }
  .orbit-txt { font-size: 0.65rem; }
}
</style>
</head>

// ══════════════════════════════════════
//  CAROUSEL ENGINE — 縦スタック グループ軌道
//  3枚1組で楕円を周回。
//  前面に来たとき3枚が縦に広がって全部見える。
//  背面では重なって1枚分に収束。
// ══════════════════════════════════════
const STACK = 3;
let angle = 0;
let speed = 0.08;
let paused = false;
let raf;

const wrap    = document.getElementById('carousel-wrap');
const orbitEl = document.getElementById('orbit-cards');
const W = () => wrap.offsetWidth;
const H = () => wrap.offsetHeight;

const GROUPS    = Math.ceil(data.length / STACK);
const GROUP_GAP = (Math.PI * 2) / GROUPS;

// カードの見た目の高さ＋隙間（px）
const CARD_H  = 108;
const CARD_GAP = 10;

const cardEls = data.map((item, i) => {
  const ci = cats[item.cat];
  const el = document.createElement('div');
  el.className = 'orbit-card';
  el.innerHTML = `
    <div class="orbit-card-inner">
      <div class="orbit-cat">
        <span class="orbit-cat-dot" style="background:${ci.color}"></span>
        <span style="color:${ci.color}">${item.cat}</span>
      </div>
      <div class="orbit-txt">${item.short}</div>
    </div>
  `;
  el.querySelector('.orbit-card-inner').addEventListener('click', () => openPanel(item));
  orbitEl.appendChild(el);
  return el;
});

function orbitFrame() {
  if (!paused) angle += speed * Math.PI / 180;

  const w = W(), h = H();
  const cx = w / 2, cy = h * 0.35;
  const rx = w * 0.42, ry = h * 0.25;

  data.forEach((item, i) => {
    const gIdx     = Math.floor(i / STACK);
    const posInGrp = i % STACK;
    const stackSz  = Math.min(STACK, data.length - gIdx * STACK);

    // グループの軌道角度
    const a    = angle + gIdx * GROUP_GAP;
    const cosA = Math.cos(a), sinA = Math.sin(a);
    // depth: 0=真後ろ、1=真前
    const depth = (sinA + 1) / 2;

    // グループ中心の座標
    const gx = cx + cosA * rx;
    const gy = cy + sinA * ry * 0.65;

    // 縦スタックのY オフセット
    // depth=1 → 完全展開（各カードが等間隔縦並び）
    // depth=0 → 完全収束（全カードが中心に重なる）
    const spread    = Math.max(0, (depth - 0.3) / 0.7); // 0.3以下では重なる
    const totalH    = (stackSz - 1) * (CARD_H + CARD_GAP);
    const expandedY = -totalH / 2 + posInGrp * (CARD_H + CARD_GAP);
    // 背面では後ろのカードを少しずらしてスタック感
    const collapsedY = posInGrp * 4;
    const cardOffsetY = expandedY * spread + collapsedY * (1 - spread);

    const sx = gx;
    const sy = gy + cardOffsetY;

    const scale = 0.36 + depth * 0.64;

    // 前面: 全カード見える。背面: 先頭だけ薄く見える
    let opacity;
    if (depth < 0.06) {
      opacity = 0;
    } else if (depth > 0.45) {
      opacity = 0.12 + depth * 0.88; // 前面は全枚表示
    } else {
      // 背面: posInGrp=0 だけうっすら、後続は非表示
      opacity = posInGrp === 0 ? (0.08 + depth * 0.4) : 0;
    }

    const z        = Math.round(depth * 100) * 10 + (STACK - posInGrp);
    const isFront  = depth > 0.65;

    const el = cardEls[i];
    el.style.cssText = `
      position:absolute; left:${sx}px; top:${sy}px;
      transform:scale(${scale.toFixed(3)});
      opacity:${Math.max(0, opacity).toFixed(3)};
      z-index:${z};
      pointer-events:${isFront ? 'all' : 'none'};
      will-change:transform,opacity;
    `;
    el.classList.toggle('front', isFront);
  });

  raf = requestAnimationFrame(orbitFrame);
}

orbitFrame();

function setSpeed(v) {
  speed = v;
  ['spd0','spd1','spd2'].forEach((id, idx) => {
    document.getElementById(id).classList.toggle('on', [0.08, 0.5, 1.2][idx] === v);
  });
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = paused ? '▶ 流す' : '⏸ 止める';
  btn.classList.toggle('on', paused);
  if (!paused) orbitFrame();
}

// ══════════════════════════════════════
//  PANEL
// ══════════════════════════════════════
function openPanel(item) {
  const ci = cats[item.cat];
  document.getElementById('pnlCat').innerHTML =
    `<span class="orbit-cat-dot" style="background:${ci.color};width:8px;height:8px;border-radius:50%;display:inline-block;"></span>
     <span style="color:${ci.color}">${item.cat}</span>`;
  document.getElementById('pnlShort').textContent = item.short;
  document.getElementById('pnlTxt').textContent   = item.text;
  document.getElementById('veil').classList.add('on');
}
function closePanel() { document.getElementById('veil').classList.remove('on'); }
function handleVeil(e) { if (e.target === document.getElementById('veil')) closePanel(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// ══════════════════════════════════════
//  LIST + FILTER
// ══════════════════════════════════════
let activeCat = 'ALL';

// Build filter buttons
const filterRow = document.getElementById('filterRow');
Object.entries(cats).forEach(([name, ci]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.setAttribute('data-cat', name);
  btn.onclick = () => filterCat(name);
  btn.innerHTML = `<span class="filter-dot" style="background:${ci.color}"></span>${name}`;
  filterRow.appendChild(btn);
});

function filterCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-cat') === cat);
  });
  renderList();
}

function renderList() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  const filtered = activeCat === 'ALL' ? data : data.filter(d => d.cat === activeCat);
  filtered.forEach(item => {
    const ci = cats[item.cat];
    const card = document.createElement('div');
    card.className = 'list-card';
    card.style.setProperty('--cat-color', ci.color);
    card.innerHTML = `
      <div class="list-card-cat" style="color:${ci.color}">
        <span class="orbit-cat-dot" style="background:${ci.color};width:6px;height:6px;border-radius:50%;display:inline-block;"></span>
        ${item.cat}
      </div>
      <div class="list-card-short">${item.short}</div>
    `;
    card.addEventListener('click', () => openPanel(item));
    grid.appendChild(card);
  });
}

renderList();
